<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SlackVault Documentation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3d1140"/>
      <stop offset="0.55" stop-color="#4a154b"/>
      <stop offset="1" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="vault" x1="120" y1="180" x2="360" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#611f69"/>
      <stop offset="0.5" stop-color="#4a154b"/>
      <stop offset="1" stop-color="#36C5F0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Vault emblem -->
  <g transform="translate(110,205)">
    <rect x="0" y="0" width="220" height="200" rx="22" fill="url(#vault)" stroke="#ECB22E" stroke-width="6"/>
    <circle cx="110" cy="100" r="60" fill="none" stroke="white" stroke-width="9" opacity="0.92"/>
    <rect x="78" y="88" width="64" height="11" rx="5.5" fill="white"/>
    <rect x="78" y="112" width="64" height="11" rx="5.5" fill="white"/>
    <rect x="92" y="74" width="11" height="64" rx="5.5" fill="white"/>
    <rect x="117" y="74" width="11" height="64" rx="5.5" fill="white"/>
  </g>

  <!-- Text -->
  <text x="400" y="270" font-family="Inter, system-ui, sans-serif" font-size="86" font-weight="800" fill="#ffffff">SlackVault</text>
  <text x="402" y="335" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="600" fill="#36C5F0">Documentation</text>
  <text x="402" y="400" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="400" fill="#e9d9ec">Back up &amp; archive your Slack workspace</text>
  <text x="402" y="442" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="400" fill="#e9d9ec">to storage you control — at zero cost.</text>
  <text x="402" y="520" font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#bda6c2">slackvault-docs.aoneahsan.com · by Ahsan Mahmood</text>
</svg>
