<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Vault door shape -->
  <rect x="10" y="15" width="80" height="70" rx="8" fill="url(#vaultGradient)" stroke="url(#borderGradient)" stroke-width="3"/>

  <!-- Vault lock circle -->
  <circle cx="50" cy="50" r="22" fill="none" stroke="white" stroke-width="4" opacity="0.9"/>

  <!-- Slack-inspired hash pattern inside vault -->
  <g opacity="0.95">
    <!-- Horizontal bars -->
    <rect x="35" y="42" width="30" height="5" rx="2.5" fill="white"/>
    <rect x="35" y="53" width="30" height="5" rx="2.5" fill="white"/>
    <!-- Vertical bars -->
    <rect x="42" y="35" width="5" height="30" rx="2.5" fill="white"/>
    <rect x="53" y="35" width="5" height="30" rx="2.5" fill="white"/>
  </g>

  <!-- Lock handle dots -->
  <circle cx="26" cy="50" r="4" fill="white" opacity="0.7"/>
  <circle cx="74" cy="50" r="4" fill="white" opacity="0.7"/>
  <circle cx="50" cy="26" r="4" fill="white" opacity="0.7"/>

  <defs>
    <linearGradient id="vaultGradient" x1="10" y1="15" x2="90" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#611f69"/>
      <stop offset="0.5" stop-color="#4a154b"/>
      <stop offset="1" stop-color="#36C5F0"/>
    </linearGradient>
    <linearGradient id="borderGradient" x1="10" y1="15" x2="90" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECB22E"/>
      <stop offset="1" stop-color="#2EB67D"/>
    </linearGradient>
  </defs>
</svg>
